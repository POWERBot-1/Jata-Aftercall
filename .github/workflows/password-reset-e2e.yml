name: Password reset production E2E

# Manual, two-phase end-to-end verification of the password-reset flow against a live
# deployment. See scripts/ci/password-reset-e2e.mjs for the charter, phases and exit codes.
#
# This workflow is deliberately NOT triggered by pushes or deployments: it sends a real
# recovery email to the operator-designated test account and must only run on purpose.
#
# Secrets (repository level):
#   E2E_ACCOUNT_EMAIL  the test account address (never printed)
#   E2E_RESET_TOKEN    phase `complete` only — the one-time token read from the delivered
#                      email; set it right before the run and delete it afterwards
#
# Phase `request` registers the test account if absent and proves anti-enumeration.
# Phase `complete` redeems the one-time link exactly once and proves the new password signs in.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "request = ask for the reset link; complete = redeem it and log in"
        required: true
        type: choice
        options:
          - request
          - complete
      base_url:
        description: "Base URL of the deployment to verify"
        required: false
        default: "https://jataaftercall.co.ke"

permissions:
  contents: read

concurrency:
  group: password-reset-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Password reset E2E (${{ inputs.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Run ${{ inputs.phase }} phase
        env:
          E2E_PHASE: ${{ inputs.phase }}
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
          E2E_RESET_TOKEN: ${{ secrets.E2E_RESET_TOKEN }}
        run: node scripts/ci/password-reset-e2e.mjs
