name: Interactive Business E2E

# Runs the §66 end-to-end journey (tests/e2e/interactive-business-journey.test.ts) against a
# real PostgreSQL database provisioned exactly the way production is: prisma migrate deploy.
#
# The sandbox that built this package has no outbound access to the Prisma binary hosts and no
# local database, so the gate executes here instead.
#
# No Paystack secret is configured: the journey settles payments through the application's own
# test-settlement branch (NODE_ENV !== "production" && !PAYSTACK_SECRET_KEY), which is the same
# code path the Paystack webhook calls.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: Journey against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jata
          POSTGRES_PASSWORD: jata
          POSTGRES_DB: jata_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read
      issues: write
      pull-requests: write

    env:
      DATABASE_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      AUTH_SECRET: interactive-business-e2e-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          set -o pipefail
          npx prisma generate 2>&1 | tee /tmp/step-generate.log

      - name: Apply migrations
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee /tmp/step-migrate.log

      - name: Seed plans
        run: |
          set -o pipefail
          npm run seed 2>&1 | tee /tmp/step-seed.log

      # The PlanConfig reconciliation that production runs against its own catalogue is
      # exercised here against the disposable CI database first: dry run, apply, verify.
      - name: Reconcile the plan catalogue (dry run, apply, verify)
        run: |
          set -o pipefail
          npm run reconcile:plans 2>&1 | tee /tmp/step-plans-dry.log
          npm run reconcile:plans -- --apply 2>&1 | tee /tmp/step-plans-apply.log

      - name: Run the journey suites (§66 + canonical)
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/step-journey.log

      # Failing output is posted to the pull request so a broken journey can be triaged
      # without digging through runner logs.
      - name: Report failing output to the pull request
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (file, limit) => {
              try { return fs.readFileSync(file, 'utf8').slice(-limit); } catch (e) { return '(no output captured)'; }
            };
            const body = [
              ['npm run test:e2e', '/tmp/step-journey.log', 8000],
              ['prisma migrate deploy', '/tmp/step-migrate.log', 4000],
              ['npm run reconcile:plans -- --apply', '/tmp/step-plans-apply.log', 2000],
              ['prisma generate', '/tmp/step-generate.log', 2000],
              ['npm run seed', '/tmp/step-seed.log', 2000],
            ].map(([label, file, limit]) => `### ${label}\n\n\`\`\`\n${read(file, limit)}\n\`\`\``).join('\n\n');
            const issue = context.payload.pull_request ? context.payload.pull_request.number : 19;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue,
                body: `Interactive Business E2E failed on \`${context.sha}\` (${context.runId}):\n\n${body}`.slice(0, 40000),
              });
            } catch (e) {
              console.log('comment failed:', String(e).slice(0, 300));
            }
