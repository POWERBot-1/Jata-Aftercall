name: Interactive Business E2E

# Runs the §66 end-to-end journey (tests/e2e/interactive-business-journey.test.ts) against a
# real PostgreSQL database. The sandbox that built this package has no outbound access to the
# Prisma binary hosts and no local database, so the gate executes here instead.
#
# No Paystack secret is configured: the journey settles payments through the application's own
# test-settlement branch (NODE_ENV !== "production" && !PAYSTACK_SECRET_KEY), which is the same
# code path the Paystack webhook calls.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: Journey against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jata
          POSTGRES_PASSWORD: jata
          POSTGRES_DB: jata_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read
      issues: write
      pull-requests: write

    env:
      DATABASE_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      AUTH_SECRET: interactive-business-e2e-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          set -o pipefail
          npx prisma generate 2>&1 | tee /tmp/step-generate.log

      # Diagnostic for now: the checked-in migrations predate the commerce tables, so
      # migrate deploy still fails. It becomes the real provisioning step once the
      # baseline migration below lands.
      - name: Apply migrations
        continue-on-error: true
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee /tmp/step-migrate.log

      - name: Sync the schema to the disposable database
        run: |
          set -o pipefail
          npx prisma db push --skip-generate --accept-data-loss 2>&1 | tee /tmp/step-push.log

      - name: Seed plans
        run: |
          set -o pipefail
          npm run seed 2>&1 | tee /tmp/step-seed.log

      - name: Run the §66 journey
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/step-journey.log

      # Diagnostics: the checked-in migrations lag behind the schema, so report what a
      # deployment still needs. Never affects the journey above.
      - name: Capture pending schema DDL
        continue-on-error: true
        run: |
          PGPASSWORD=jata psql -h localhost -U jata -d postgres -c 'CREATE DATABASE jata_shadow;' || true
          mv prisma/migrations/20261002000000_interactive_business /tmp/interactive_migration
          set -o pipefail
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://jata:jata@localhost:5432/jata_shadow?schema=public" --script 2>&1 | tee /tmp/step-diff.log
          mv /tmp/interactive_migration prisma/migrations/20261002000000_interactive_business

      # Runner logs are not readable from the sandbox that authored this workflow, so the
      # captured output is posted to the pull request instead.
      - name: Report output to the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const steps = [
              ['prisma generate', '/tmp/step-generate.log', 4000],
              ['prisma migrate deploy', '/tmp/step-migrate.log', 8000],
              ['prisma db push', '/tmp/step-push.log', 4000],
              ['npm run seed', '/tmp/step-seed.log', 3000],
              ['npm run test:e2e', '/tmp/step-journey.log', 8000],
              ['pending schema DDL', '/tmp/step-diff.log', 30000],
            ];
            const body = steps
              .map(([label, file, limit]) => {
                let text = '(no output captured)';
                try { text = fs.readFileSync(file, 'utf8').slice(-limit); } catch (e) {}
                return `### ${label}\\n\\n\\`\\`\\`\\n${text}\\n\\`\\`\\``;
              })
              .join('\\n\\n');
            const issue = context.payload.pull_request ? context.payload.pull_request.number : 19;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: `Interactive Business E2E on \\`${context.sha}\\` (${context.runId}) — captured output:\\n\\n${body}`.slice(0, 64000),
            });
