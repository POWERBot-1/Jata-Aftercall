name: Interactive Business E2E

# Runs the §66 end-to-end journey (tests/e2e/interactive-business-journey.test.ts) and the
# Business POS journey (tests/e2e/business-pos-journey.test.ts) against a real PostgreSQL database
# provisioned exactly the way production is: prisma migrate deploy.
#
# The sandbox that built this package has no outbound access to the Prisma binary hosts and no
# local database, so the gate executes here instead.
#
# No Paystack secret is configured: the journey settles payments through the application's own
# test-settlement branch (NODE_ENV !== "production" && !PAYSTACK_SECRET_KEY), which is the same
# code path the Paystack webhook calls.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: Journey against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jata
          POSTGRES_PASSWORD: jata
          POSTGRES_DB: jata_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read
      issues: write
      pull-requests: write

    env:
      DATABASE_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      # The newer native-Prisma suites intentionally self-skip without this separate test-only URL.
      # Both point ONLY at this job's disposable PostgreSQL service, never a deployment secret.
      PRISMA_TEST_DATABASE_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      AUTH_SECRET: interactive-business-e2e-test-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # puppeteer-core@25 (the only line free of the extract-zip advisories) requires
          # Node >= 22.12.0, and Node 22 is inside the range package.json already declares.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production advisory gate and full-audit findings
        run: |
          set -o pipefail
          # Required production gate: a nonzero audit exit fails this step. No ignored production advisory.
          npm audit --omit=dev --json > /tmp/step-production-audit.json
          # Full audit remains separately FAIL if development findings remain; this is diagnostic,
          # not a waiver/green full-security gate. Network/malformed reports also fail the step.
          set +e
          npm audit --json > /tmp/step-full-audit.json
          full_status=$?
          set -e
          FULL_AUDIT_STATUS="$full_status" node - <<'JS' | tee /tmp/step-dependency-audit.log
          const fs = require('fs');
          const production = JSON.parse(fs.readFileSync('/tmp/step-production-audit.json', 'utf8'));
          const full = JSON.parse(fs.readFileSync('/tmp/step-full-audit.json', 'utf8'));
          if (production.error || full.error || !production.metadata?.vulnerabilities || !full.metadata?.vulnerabilities) throw new Error('BLOCKED: advisory service/report unavailable');
          if (production.metadata.vulnerabilities.total !== 0) throw new Error('Production advisories remain');
          console.log('PASS production dependency audit: 0 findings');
          const risk = full.metadata.vulnerabilities;
          console.log(`${risk.total ? 'FAIL' : 'PASS'} full dependency audit: ${risk.total} findings (${risk.high} high, ${risk.moderate} moderate); exit=${process.env.FULL_AUDIT_STATUS}`);
          console.log('Open package paths: ' + Object.keys(full.vulnerabilities || {}).sort().join(', '));
          console.log('Full-security release acceptance stays OPEN while any finding remains; not provider/device/engine proof.');
          JS

      - name: Generate Prisma client
        run: |
          set -o pipefail
          npx prisma validate 2>&1 | tee /tmp/step-schema-validate.log
          npx prisma generate 2>&1 | tee /tmp/step-generate.log

      - name: Lint and TypeScript
        run: |
          npm run lint
          npm run typecheck

      - name: Apply migrations
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee /tmp/step-migrate.log

      - name: Seed plans
        run: |
          set -o pipefail
          npm run seed 2>&1 | tee /tmp/step-seed.log

      # The unit, integration and security suites must run against the same real database too.
      # They are the only coverage for the AI Business Front Desk entitlement gate, tenant
      # isolation, the publication lifecycle and the order-transition contract, and a mocked Prisma
      # client cannot catch a schema mismatch — exactly the class of bug that broke an earlier head
      # of this work. The two journey files are excluded here because they get their own dedicated
      # steps below, which mutate the same database.
      - name: Run the unit, integration and security suites against the database
        run: |
          set -o pipefail
          npx vitest run --exclude "tests/e2e/**" 2>&1 | tee /tmp/step-full-suite.log
          plain=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/step-full-suite.log)
          # The database-backed suites self-skip without DATABASE_URL, and a skipped test is not a
          # passed test, so a green check here has to mean nothing was skipped.
          if printf '%s' "$plain" | grep -qE "[1-9][0-9]* skipped"; then
            echo "Database suites skipped — DATABASE_URL did not reach vitest." >&2
            exit 1
          fi
          if ! printf '%s' "$plain" | grep -qE "[0-9]+ passed"; then
            echo "The full suite reported no passing tests." >&2
            exit 1
          fi

      - name: Run the §66 journey
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/step-journey.log
          plain=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/step-journey.log)
          if printf '%s' "$plain" | grep -qE "[1-9][0-9]* skipped"; then
            echo "Experience journey skipped — DATABASE_URL did not reach vitest." >&2
            exit 1
          fi
          if ! printf '%s' "$plain" | grep -qE "[0-9]+ passed"; then
            echo "The experience journey reported no passing steps." >&2
            exit 1
          fi

      # The Business POS journey (§4, §43, §75) runs against the same migrated, seeded database.
      - name: Run the Business POS journey
        run: |
          set -o pipefail
          npm run test:e2e:pos 2>&1 | tee /tmp/step-pos-journey.log
          # A skipped journey is not a passed journey. Every step needs DATABASE_URL and the suite
          # skips itself without it, so a green check here has to mean the steps actually ran.
          plain=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/step-pos-journey.log)
          if printf '%s' "$plain" | grep -q "skipped"; then
            echo "The Business POS journey skipped — DATABASE_URL did not reach vitest." >&2
            exit 1
          fi
          if ! printf '%s' "$plain" | grep -qE "[0-9]+ passed"; then
            echo "The Business POS journey reported no passing steps." >&2
            exit 1
          fi

      - name: Production build against the isolated test database
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/step-build.log

      - name: Production harness isolation and bundle evidence
        run: |
          set -o pipefail
          npm run test:smoke:studio 2>&1 | tee /tmp/step-studio-smoke.log
          npm run measure:studio-bundles 2>&1 | tee /tmp/step-studio-bundles.log

      # No auth mocks or application QA endpoints. Writes only the opted-in disposable DB;
      # paid rows are labelled synthetic entitlement, NOT provider/payment-verification evidence.
      - name: Authenticated production HTTP browser journey
        # M418 diagnostic arms are default OFF. To run them, set M418_DIAG_ARMS here to a
        # comma-separated arm list ("1" = all): E1-no-throttle, E1-control-retrottled,
        # E2-reversed-order, E4-wait-60s (M418_DIAG_WAIT_MS overrides the 60 s E4 wait).
        # Arms are measurements only: they never satisfy a required sample or change the verdict.
        run: |
          set -o pipefail
          export CHROME_PATH=$(command -v google-chrome || command -v chromium || true)
          STUDIO_BROWSER_TEST_WRITE=1 npm run test:browser:studio-authenticated 2>&1 | tee /tmp/step-authenticated-browser.log

      - name: Booking SSR timezone and midnight hydration regression
        run: |
          set -o pipefail
          export CHROME_PATH=$(command -v google-chrome || command -v chromium || true)
          npm run test:browser:studio-hydration 2>&1 | tee /tmp/step-hydration-browser.log
      - name: "Hydration 418 controlled race reproduction (widened RC/RV gap)"
        run: |
          set -o pipefail
          export CHROME_PATH=$(command -v google-chrome || command -v chromium || true)
          npm run test:browser:hydration-race 2>&1 | tee /tmp/step-hydration-race.log

      # Report N.13: the same harness runs twice - once against a runtime known to carry the defect
      # (positive control, must reproduce) and once against the runtime this application now ships
      # (must be clean). The control is installed under /tmp so it cannot touch package.json,
      # package-lock.json or the shipped dependency tree, and it is never bundled into the app.
      - name: "Hydration replay-cursor regression (shipped clean, 19.2 positive control)"
        run: |
          set -o pipefail
          export CHROME_PATH=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome binary missing - replay-cursor regression NOT RUN, not passed." >&2
            exit 1
          fi
          npm install --prefix /tmp/replay-control --no-save --no-audit --no-fund react@19.2.8 react-dom@19.2.8 > /tmp/step-replay-control-install.log 2>&1
          {
            echo "--- positive control: react 19.2.8 (the harness must reproduce the defect here) ---"
            REPLAY_REACT_DIR=/tmp/replay-control/node_modules npm run test:browser:hydration-replay:control
            echo "--- shipped runtime (the defect must NOT reproduce here) ---"
            npm run test:browser:hydration-replay
          } 2>&1 | tee /tmp/step-replay-hydration.log

      - name: Actual storefront Motion and immersive browser regressions
        run: |
          set -o pipefail
          export CHROME_PATH=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome binary missing — browser checks NOT RUN, not passed." >&2
            exit 1
          fi
          export BASE_URL=http://localhost:4100
          ARENA_LIVE_PREVIEW=1 NEXT_TELEMETRY_DISABLED=1 npm run dev -- --port 4100 > /tmp/step-browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          WAIT_FOR_SERVER=1 npm run test:browser:motion 2>&1 | tee /tmp/step-motion-browser.log
          npm run test:browser:immersive 2>&1 | tee /tmp/step-immersive-browser.log
          npm run test:browser:layout 2>&1 | tee /tmp/step-layout-browser.log
          # DEF-1 (§M.4): quick-action-bar labels must stay inside their own controls at 320-430px.
          npm run test:browser:actionbar 2>&1 | tee /tmp/step-actionbar-browser.log
          npm run test:browser:families 2>&1 | tee /tmp/step-family-browser.log
          npm run test:browser:media-local 2>&1 | tee /tmp/step-media-local-browser.log

      # M12 Stage B: bounded raw-order evidence artifacts (redacted — tags/offsets only).
      - name: Upload hydration raw-order evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydration-raw-order-evidence
          path: |
            .cache/verification/studio-authenticated/m418-evidence.json
            .cache/verification/studio-authenticated/results.json
          retention-days: 14
          if-no-files-found: ignore

      # Publish real successful summaries too; direct Actions log downloads may be inaccessible.
      - name: Record successful verification evidence on the pull request
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaries = (file) => {
              try {
                const text = fs.readFileSync(file, 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
                return (text.match(/^\s*(Test Files|Tests)\s+.+$|^\d+ passed, \d+ failed, 0 skipped.*$|^HYDRATION RACE RESULT .+$|^HYDRATION SAMPLE .+$|^M418E .+$|^M418 GATE .+$|^M418 DIAG .+$|^HYDRATION SAMPLES .+$|^M418 SRV .+$|^M418 SRVOFF .+$|^M418 EXPECTED .+$|^browser-side runtime: .+$|^(microtask|timeout-0|resolved-before|late-50ms) +reproducing loads .+$|^(PASS|FAIL|BLOCKED) ?\(?.*$/gm) || []).join('\n').trim() || '(no summary captured)';
              } catch { return '(no output captured)'; }
            };
            const sections = [
              ['Full native DB suite', '/tmp/step-full-suite.log'],
              ['Experience journey', '/tmp/step-journey.log'],
              ['Business POS journey', '/tmp/step-pos-journey.log'],
              ['Production HTTP isolation smoke', '/tmp/step-studio-smoke.log'],
              ['Authenticated production HTTP/browser/DB journey (synthetic entitlement, no provider)', '/tmp/step-authenticated-browser.log'],
              ['Actual isolated booking SSR/hydration (timezone/midnight)', '/tmp/step-hydration-browser.log'],
              ['Hydration #418 controlled race reproduction (widened $RC/$RV gap)', '/tmp/step-hydration-race.log'],
              ['Hydration replay-cursor regression (positive control + shipped runtime)', '/tmp/step-replay-hydration.log'],
              ['Actual Motion browser', '/tmp/step-motion-browser.log'],
              ['Immersive browser regression', '/tmp/step-immersive-browser.log'],
              ['Responsive layout regression', '/tmp/step-layout-browser.log'],
              ['Registered family geometry/SSR/touch browser', '/tmp/step-family-browser.log'],
              ['Local raster pixels (provider/persistence BLOCKED)', '/tmp/step-media-local-browser.log'],
            ].map(([label, file]) => `### ${label}\n\n\`\`\`\n${summaries(file)}\n\`\`\``).join('\n\n');
            const bundles = fs.readFileSync('/tmp/step-studio-bundles.log', 'utf8').slice(-2500);
            const dependencyAudit = fs.readFileSync('/tmp/step-dependency-audit.log', 'utf8').slice(-2500);
            const head = context.payload.pull_request.head.sha;
            const body = `Verification passed for feature head \`${head}\` (runner checkout \`${context.sha}\`). [Run ${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\n${sections}\n\n### Production gate / full dependency-audit status\n\n\`\`\`\n${dependencyAudit}\n\`\`\`\n\n### Bundle evidence\n\n\`\`\`\n${bundles}\n\`\`\`\n\nNative Prisma, lint/types, migrations, seed and production build passed. No skips permitted in the DB suites. Inherited expected failure is preserved, not fixed. Authenticated browser uses real Next HTTP/JWT cookies and disposable DB; paid entitlement is a synthetic fixture, not provider verification. Other browser catalogue/model data is synthetic/intercepted; mobile signals are simulated. Persistent-original storage/provider acceptance BLOCKED by owner deferral. No new real uploads/provider calls/spending enabled. Physical Android, live provider/payment operations and production Core Web Vitals NOT RUN. Full engine NOT COMPLETE, NOT MERGED, production NOT DEPLOYED.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body });

      # Failing output is posted to the pull request so a broken journey can be triaged
      # without digging through runner logs.
      - name: Report failing output to the pull request
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Vitest prints each failure where it happens and the runner's ::error annotations at
            // the end, so a long log needs both ends to be diagnosable from the comment alone.
            const read = (file, limit) => {
              try {
                const text = fs.readFileSync(file, 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
                if (text.length <= limit) return text;
                const half = Math.floor(limit / 2);
                const summaries = (text.match(/^\s*(Test Files|Tests)\s+.+$/gm) || []).join("\n");
                return `${summaries}\n\n${text.slice(0, half)}\n\n…[${text.length - limit} characters truncated]…\n\n${text.slice(-half)}`;
              } catch (e) { return '(no output captured)'; }
            };
            // Never-elided failure signatures: checks that throw (`FAIL ...`), uncaught browser
            // errors and their recorded M418 diagnostics, and the script's own `FAILED CHECK`
            // line. The head/tail windows above can elide the middle of a long log, which is
            // exactly where the failing check's name sat; this section cannot.
            const signatureFiles = [
              '/tmp/step-full-suite.log', '/tmp/step-authenticated-browser.log', '/tmp/step-hydration-browser.log',
              '/tmp/step-replay-hydration.log',  '/tmp/step-pos-journey.log', '/tmp/step-journey.log',
              '/tmp/step-motion-browser.log', '/tmp/step-immersive-browser.log', '/tmp/step-layout-browser.log',
              '/tmp/step-actionbar-browser.log',
              '/tmp/step-family-browser.log', '/tmp/step-media-local-browser.log', '/tmp/step-studio-smoke.log',
            ];
            const signatureLines = [];
            for (const file of signatureFiles) {
              try {
                const text = fs.readFileSync(file, 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
                for (const line of text.split('\n')) {
                  if (/^(FAIL|FAILED CHECK|BROWSER RUNTIME ERROR|M418-RECORDED|M418 GATE|M418 DIAG|HYDRATION SAMPLES)/.test(line.trim())) {
                    signatureLines.push(`${file.split('/').pop()}: ${line.trim()}`);
                  }
                }
              } catch { /* step did not run */ }
            }
            const signatures = signatureLines.length
              ? signatureLines.join('\n').slice(0, 4000)
              : '(no FAIL/BROWSER RUNTIME ERROR/FAILED CHECK lines in the captured step logs)';
            const body = [
              ['Failure signatures (never elided)', null, 0],
              ['Dependency audit', '/tmp/step-dependency-audit.log', 2500],
              ['npx vitest run --exclude tests/e2e', '/tmp/step-full-suite.log', 11000],
              ['Authenticated production HTTP browser', '/tmp/step-authenticated-browser.log', 11000],
              ['Booking SSR/hydration', '/tmp/step-hydration-browser.log', 3000],
              ['Hydration #418 controlled race reproduction', '/tmp/step-hydration-race.log', 3000],
              ['Hydration replay-cursor regression', '/tmp/step-replay-hydration.log', 3000],
              ['npm run test:e2e:pos', '/tmp/step-pos-journey.log', 11000],
              ['npm run test:e2e', '/tmp/step-journey.log', 11000],
              ['prisma migrate deploy', '/tmp/step-migrate.log', 3000],
              ['prisma generate', '/tmp/step-generate.log', 1500],
              ['npm run build', '/tmp/step-build.log', 3000],
              ['Production HTTP smoke', '/tmp/step-studio-smoke.log', 1500],
              ['Bundle evidence', '/tmp/step-studio-bundles.log', 1500],
              ['Motion browser', '/tmp/step-motion-browser.log', 4000],
              ['Immersive browser', '/tmp/step-immersive-browser.log', 2000],
              ['Responsive browser', '/tmp/step-layout-browser.log', 1000],
              ['Family browser', '/tmp/step-family-browser.log', 2500],
              ['Local raster pixels', '/tmp/step-media-local-browser.log', 1500],
              ['Local browser server', '/tmp/step-browser-server.log', 1000],
              ['npm run seed', '/tmp/step-seed.log', 1500],
            ].map(([label, file, limit]) => `### ${label}\n\n\`\`\`\n${file === null ? signatures : read(file, limit)}\n\`\`\``).join('\n\n');
            const issue = context.payload.pull_request ? context.payload.pull_request.number : 19;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue,
                body: `Database journeys failed on \`${context.sha}\` (${context.runId}):\n\n${body}`.slice(0, 60000),
              });
            } catch (e) {
              console.log('comment failed:', String(e).slice(0, 300));
            }

  # The migration target guard's own tests.
  #
  # A separate job on purpose: the guard needs no database, no secrets and no
  # installed dependencies, so a failure here is unambiguous and reports in
  # seconds instead of waiting behind the PostgreSQL service. Keeping it
  # separate also means a broken database journey cannot hide a guard
  # regression, and a guard regression cannot be mistaken for a flaky database.
  #
  # Same triggers as the e2e job (pull requests targeting main, pushes to main,
  # manual dispatch), so the guard is exercised on every change that could reach
  # production. `node --test` exits non-zero when any test fails, which fails
  # this job and therefore the workflow.
  #
  # The two files are listed explicitly rather than globbed. A glob would depend
  # on the runner's Node version and shell; an explicit list behaves identically
  # everywhere and makes it obvious that a newly added guard test file has to be
  # added here too.
  migration-guard:
    name: Migration target guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Deliberately no `npm ci`. The guard and its tests have zero dependencies
      # and execute in a build container before application packages are
      # guaranteed to exist; running them without `node_modules` proves that
      # stays true. It also means a broken dependency tree cannot stop the
      # guard's own tests from running.
      - name: Migration target guard tests
        run: node --test scripts/__tests__/migration-target-guard.test.mjs scripts/__tests__/migration-gate-refusal.test.mjs
