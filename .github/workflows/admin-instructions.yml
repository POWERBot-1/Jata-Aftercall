name: Admin instruction integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  instruction-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate committed register and full history
        run: node scripts/admin/check-building-instructions.mjs --ci
      - name: Exercise valid and destructive history fixtures
        run: node --test tests/admin/instruction-integrity.test.mjs
