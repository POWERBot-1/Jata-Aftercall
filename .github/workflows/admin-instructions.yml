name: Admin instruction integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  instruction-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate committed register and full history
        run: node scripts/admin/check-building-instructions.mjs --ci
      - name: Exercise valid and destructive history fixtures
        run: node --test scripts/admin/tests/instruction-integrity.test.mjs
  programme-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Determine programme acceptance scope
        id: scope
        shell: bash
        run: |
          case "$GITHUB_HEAD_REF" in
            arena/website-studio-2-0-p1-tenant-foundation) echo "phase=p1" >> "$GITHUB_OUTPUT" ;;
            arena/website-studio-2-0-p2-multi-site-data-plane) echo "phase=p2" >> "$GITHUB_OUTPUT" ;;
            *) echo "phase=global" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Test completeness gate
        run: |
          node --test scripts/admin/tests/programme-readiness.test.mjs
          node --test scripts/admin/tests/website-studio-readiness.test.mjs
      - name: Require verified repository-wide programme acceptance
        if: steps.scope.outputs.phase == 'global'
        run: node scripts/admin/check-programme-readiness.mjs
      - name: Require verified Website Studio acceptance
        if: steps.scope.outputs.phase != 'global'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/admin/check-website-studio-readiness.mjs --phase=${{ steps.scope.outputs.phase }}
