name: Website Studio 2.0 — tenant and content acceptance
# This release workflow is paired with the scoped, evidence-verified programme gate.
# PostgreSQL-only tests run under a separate Vitest module registry.

on:
  pull_request:
    branches:
      - main
      - arena/website-studio-2-0-p1-tenant-foundation
    paths:
      - "app/api/studio/websites/**"
      - "lib/experience/**"
      - "lib/db.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "tests/integration/website-studio-*.test.ts"
      - "tests/integration/storefront-per-site-publication-postgres.test.ts"
      - "tests/integration/studio-publication-state-machine-postgres.test.ts"
      - "tests/unit/website-studio-*.test.ts"
      # The prompt-to-website journey's own wiring test: a change to it can weaken or
      # disable the acceptance step, so it must run the acceptance.
      - "tests/unit/prompt-to-website-journey-wiring.test.ts"
      - "tests/unit/classic-sticky-actionbar-gutter.test.ts"
      - "tests/unit/publication-state-machine.test.ts"
      - "tests/unit/storefront-public-content.test.ts"
      - "tests/unit/storefront-motion-inheritance.test.ts"
      - "app/b/**"
      - "components/storefront/**"
      - "tests/helpers/website-studio-setup.ts"
      - "vitest.config.ts"
      - "vitest.website-studio-postgres.config.ts"
      - "tests/helpers/server-only-setup.ts"
      - "docs/WEBSITE_STUDIO_2_0_IMPLEMENTATION_PLAN.md"
      - "scripts/browser/studio-authenticated.check.mjs"
      - "scripts/browser/studio-journey-safety.mjs"
      - "scripts/browser/website-studio-openpage.check.mjs"
      - "app/dev/website-studio-preview/**"
      - "components/studio/**"
      - ".github/workflows/website-studio-2-0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-studio-2-0:
    name: Prisma, tenant tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jata
          POSTGRES_PASSWORD: jata
          POSTGRES_DB: jata_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jata -d jata_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      DIRECT_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      PRISMA_TEST_DATABASE_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      NODE_ENV: test
      JATA_ALLOW_FIXTURE_SEED: "true"
      AUTH_SECRET: interactive-business-e2e-test-secret
      NEXTAUTH_SECRET: interactive-business-e2e-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Verify Website Studio migration idempotency on disposable PostgreSQL
        run: npx prisma db execute --file prisma/migrations/20261108020000_website_studio_2_0_multi_site_content/migration.sql --schema prisma/schema.prisma
      - name: Generate and mask ephemeral fixture password
        run: |
          fixture_password="$(openssl rand -base64 48)"
          echo "::add-mask::$fixture_password"
          printf 'DEMO_FIXTURE_PASSWORD=%s\n' "$fixture_password" >> "$GITHUB_ENV"
      - name: Seed disposable test database
        run: npm run seed
      # Legacy route tests use the shared guard mock; the two real PostgreSQL Studio suites run under their isolated config below.
      - name: Run full no-database and database-backed test suite
        run: |
          set -o pipefail
          npx vitest run --exclude tests/e2e \
            --exclude tests/integration/website-studio-tenant-postgres.test.ts \
            --exclude tests/integration/website-studio-multisite-api.test.ts \
            --exclude tests/integration/storefront-per-site-publication-postgres.test.ts \
            --exclude tests/integration/studio-publication-state-machine-postgres.test.ts \
            2>&1 | tee /tmp/website-studio-vitest.log
          WEBSITE_STUDIO_POSTGRES_TESTS=1 npx vitest run --config vitest.website-studio-postgres.config.ts 2>&1 | tee -a /tmp/website-studio-vitest.log
          plain="$(sed -e 's/\\x1b\\[[0-9;]*m//g' /tmp/website-studio-vitest.log)"
          if printf '%s' "$plain" | grep -qE "[1-9][0-9]* skipped"; then
            echo "Website Studio/database acceptance reported skipped tests — not a pass." >&2
            exit 1
          fi
          if ! printf '%s' "$plain" | grep -qE "[0-9]+ passed"; then
            echo "Website Studio/database acceptance reported no passing tests." >&2
            exit 1
          fi
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Authenticated Website Studio browser acceptance
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ] || [ ! -x "$CHROME_PATH" ]; then
            echo "Chrome executable missing — Website Studio browser acceptance NOT RUN, not passed." >&2
            exit 1
          fi
          STUDIO_BROWSER_TEST_WRITE=1 npm run test:browser:studio-authenticated

      # ───────────────────────────────────────────────────────────────────────────
      # Prompt-to-website browser journey: new business → prompt → 3 layouts →
      # retention → refinement → save → reopen → device previews → guarded publish.
      #
      # Runs in THIS job, not a separate one, on purpose: this job already produces a
      # verified production build against a real disposable PostgreSQL database. Reusing
      # it means the journey is exercised against the same artifact the server-side
      # suites just validated, instead of a second build that could drift.
      #
      # LIMITATION, stated rather than implied: the check stubs the authenticated API
      # calls, so it proves the UI journey and asset retention — not server truth.
      # Authentication, tenant isolation, draft-version concurrency and publication are
      # proven by the vitest/PostgreSQL steps above in this same job.
      - name: Prompt-to-website browser journey (UI journey; server truth proven above)
        env:
          STUDIO_BASE_URL: http://127.0.0.1:3100
          STUDIO_EVIDENCE_DIR: .cache/verification/studio-openpage
          # The job-level NODE_ENV is "test", which Next's dev server does not accept
          # (it expects development or production and refuses to boot otherwise). The
          # fixture page only special-cases "production", so "development" is both
          # permitted and sufficient for the route to render.
          NODE_ENV: development
        run: |
          set -o pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ] || [ ! -x "$CHROME_PATH" ]; then
            echo "::error::Chrome executable missing — prompt-to-website journey NOT RUN, not passed."
            exit 1
          fi
          # Serve the build that was just produced and verified. No rebuild, no second schema.
          # A DEV server, because app/dev/website-studio-preview/page.tsx returns notFound() when
          # NODE_ENV === "production" (by design: the fixture must never be reachable in production).
          # `next start` is production, so the page 404'd and readiness could never succeed. The
          # production build is still what the authenticated acceptance step above exercises.
          # The CLI is invoked directly: `npx` re-resolves and can exit asynchronously.
          # --webpack is required: Next 16 enables Turbopack by default and refuses to boot with a
          # custom webpack config unless the bundler is chosen explicitly (next.config.ts has one for
          # the node: import shim). The production build in the step above is unaffected.
          node node_modules/next/dist/bin/next dev --webpack -H 127.0.0.1 -p 3100 > /tmp/step-journey-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          # First dev-server compile of the route is slow; allow up to three minutes.
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null "$STUDIO_BASE_URL/dev/website-studio-preview" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::The journey server never became ready — BLOCKED, not passed."
            # Never leave a readiness failure undiagnosable: ship the server log as an annotation,
            # because artifact and job-log downloads are blocked from some review environments.
            echo "--- server log ---"
            tail -40 /tmp/step-journey-server.log || true
            # Also emit as an annotation: job logs and artifacts are unreachable from some
            # review environments, and annotations are the only channel that survives.
            echo "::error title=JOURNEY_SERVER_LOG::$(tail -c 1200 /tmp/step-journey-server.log | tr '\n' ' ' | sed 's/%/%25/g' | sed 's/\r/%0D/g')"
            echo "--- port listeners ---"
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true) | head -20
            echo "--- direct probe ---"
            curl -sS -o /dev/null -w "http=%{http_code} exit=%{exitcode}\n" "$STUDIO_BASE_URL/dev/website-studio-preview" 2>&1 | tail -3 || true
            exit 1
          fi
          set +e
          node scripts/browser/website-studio-openpage.check.mjs 2>&1 | tee /tmp/step-journey-browser.log
          journey_status=${PIPESTATUS[0]}
          set -e
          if [ "$journey_status" -ne 0 ]; then
            # The check throws on its first failed assertion and prints only to stdout, which is
            # unreachable from some review environments. Annotate the tail so a failure is
            # diagnosable from the checks list, and fail with the script's own exit code.
            # The check's own thrown message is at the TOP of its output; the tail is usually a
            # noisy puppeteer object dump. Annotate the head, which names the failed assertion.
            echo "::error title=JOURNEY_CHECK_FAILED::$(head -c 1200 /tmp/step-journey-browser.log | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "--- browser log ---"
            tail -60 /tmp/step-journey-browser.log || true
            exit "$journey_status"
          fi

      - name: Upload prompt-to-website journey evidence (including the log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-to-website-journey-${{ github.sha }}
          path: |
            /tmp/step-journey-*.log
            .cache/verification/studio-openpage/
          if-no-files-found: warn

      - name: Upload Website Studio acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-studio-2-0-acceptance-${{ github.sha }}
          path: |
            /tmp/website-studio-vitest.log
            .cache/verification/studio-authenticated/
          if-no-files-found: warn
          retention-days: 30
