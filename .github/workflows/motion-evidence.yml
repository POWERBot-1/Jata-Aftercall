name: Motion isolated browser evidence
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jata
          POSTGRES_PASSWORD: jata
          POSTGRES_DB: jata_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      AUTH_SECRET: interactive-business-e2e-test-secret
      NEXT_TELEMETRY_DISABLED: '1'
      MOTION_ISOLATED: '1'
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash scripts/lib/prisma-generate.sh
      - run: bash scripts/lib/prisma-cli.sh migrate deploy
      - name: Generate ephemeral demo fixture password
        run: printf 'DEMO_FIXTURE_PASSWORD=%s\n' "$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')" >> "$GITHUB_ENV"
      - name: Seed fictional database fixtures
        env:
          JATA_ALLOW_FIXTURE_SEED: "true"
        run: npm run seed
      - run: npm run build
      - name: Start isolated production build
        run: |
          PUBLIC_BASE_URL=http://localhost:4100 NEXTAUTH_URL=http://localhost:4100 npx next start -p 4100 -H 127.0.0.1 > /tmp/motion-server.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://localhost:4100/health >/dev/null 2>&1 && exit 0; sleep 2; done
          cat /tmp/motion-server.log; exit 1
      # Bounded on purpose. On 2026-11-11 this step sat in_progress for 37+ minutes on
      # `sudo apt-get update` (an unbounded network call inside a 50-minute job): the capture steps
      # never ran, so the run produced neither a pass nor a failure, only silence. Every network
      # action here now has its own deadline and a named BLOCKED annotation.
      - name: Ensure video encoder is available on the disposable runner
        timeout-minutes: 8
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          installed=0
          timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg && installed=1
          if [ "$installed" != "1" ] || ! command -v ffmpeg >/dev/null 2>&1; then
            echo "::error title=MOTION_ENCODER_BLOCKED::ffmpeg is unavailable and could not be installed within the deadline. No recording evidence is claimed for this head."
            exit 1
          fi
          ffmpeg -version | head -1
      - name: Capture real generated Studio family paths
        timeout-minutes: 15
        if: ${{ !cancelled() }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          node scripts/motion/generated-family-evidence.mjs
      - name: Capture actual storefront and preview motion events
        timeout-minutes: 15
        if: ${{ !cancelled() }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          node scripts/motion/route-behaviour-evidence.mjs
      - name: Upload route behaviour observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-routes-${{ github.event.pull_request.head.sha || github.sha }}
          path: motion-route-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Capture classic and AI preview evidence in Chrome
        timeout-minutes: 15
        if: ${{ !cancelled() }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          node scripts/motion/disposable-browser-evidence.mjs
      - name: Upload exact-head generated-family observations and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-families-${{ github.event.pull_request.head.sha || github.sha }}
          path: motion-family-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Upload exact-head observations, screenshots and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-partial-${{ github.event.pull_request.head.sha || github.sha }}
          path: motion-evidence/
          retention-days: 30
          if-no-files-found: error
