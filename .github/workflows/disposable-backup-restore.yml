name: Disposable backup and restore rehearsal

# This workflow proves logical backup/restore mechanics on a disposable PostgreSQL 18
# service only. It does not test Neon PITR/provider snapshots and never connects to production.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/disposable-backup-restore.yml"
      - "scripts/ci/rehearse-disposable-backup-restore.sh"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disposable-backup-restore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    name: Full logical backup and restore on disposable PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jata_ci
          POSTGRES_PASSWORD: jata_ci_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --retries 10
    env:
      CI: "true"
      AUTH_SECRET: disposable-backup-restore-only-secret
      DATABASE_URL: postgresql://jata_ci:jata_ci_pw@localhost:5432/jata_recovery?schema=public
      DIRECT_URL: postgresql://jata_ci:jata_ci_pw@localhost:5432/jata_recovery?schema=public
      PG_ADMIN_URL: postgresql://jata_ci:jata_ci_pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
      - name: Prepare PostgreSQL 18 client wrappers
        run: |
          set -euo pipefail
          docker pull postgres:18
          for tool in psql pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/$tool" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$(basename "$0")"
          exec docker run --rm --network host -v "$RUNNER_TEMP:$RUNNER_TEMP" postgres:18 "$tool" "$@"
          SH
            chmod +x "$RUNNER_TEMP/$tool"
          done
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pg_dump" --version
          "$RUNNER_TEMP/pg_restore" --version
      - name: Install dependencies and generate Prisma client
        run: |
          set -euo pipefail
          npm ci
          test -f node_modules/.prisma/client/index.js
      - name: Create disposable database and apply committed migrations
        run: |
          set -euo pipefail
          psql "$PG_ADMIN_URL" -X -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE "jata_recovery"'
          npx prisma migrate deploy
      - name: Generate and mask an ephemeral fixture password
        run: |
          set -euo pipefail
          fixture_password="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$fixture_password"
          printf 'DEMO_FIXTURE_PASSWORD=%s\n' "$fixture_password" >> "$GITHUB_ENV"
      - name: Seed only synthetic records
        env:
          JATA_ALLOW_FIXTURE_SEED: "true"
        run: |
          set -euo pipefail
          npm run seed
      - name: Rehearse full logical backup and restore
        run: |
          set -euo pipefail
          bash scripts/ci/rehearse-disposable-backup-restore.sh
      - name: Upload non-sensitive verdict
        if: always()
        run: |
          {
            echo "### Disposable PostgreSQL 18 backup/restore"
            echo
            if [ -f "${RUNNER_TEMP}/jata-source-counts.txt" ] && [ -f "${RUNNER_TEMP}/jata-restored-counts.txt" ]; then
              echo "Source and restored table row counts were captured."
              echo "Source tables: $(wc -l < "${RUNNER_TEMP}/jata-source-counts.txt")"
              echo "Restored tables: $(wc -l < "${RUNNER_TEMP}/jata-restored-counts.txt")"
            else
              echo "The rehearsal did not reach row-count comparison."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
