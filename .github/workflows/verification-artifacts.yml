name: Verification artifacts (tooling transfer)

# Tooling-only workflow. It exists because the sandboxed build environment that produced the
# workspace UI work has no outbound access to the Prisma engine binary host, so `prisma generate`
# and native-database work cannot run there at all. This job runs the same generate/migrate steps
# that `.github/workflows/interactive-business-e2e.yml` already runs, and publishes the resulting
# generated client + engine binaries onto a temporary, never-merged artifacts branch so the review
# environment can run the *native* Prisma client against its own disposable database.
#
# It grants nothing: no application code is built, deployed or published here, the artifacts
# branch is deleted after review, and this workflow is dispatch-only so it never becomes a pull
# request check and cannot influence branch protection.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-engines:
    name: Publish generated Prisma client and engines
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jata
          POSTGRES_PASSWORD: jata
          POSTGRES_DB: jata_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      PRISMA_TEST_DATABASE_URL: postgresql://jata:jata@localhost:5432/jata_e2e?schema=public
      AUTH_SECRET: interactive-business-e2e-test-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          set -o pipefail
          npx prisma validate 2>&1 | tee /tmp/step-schema-validate.log
          npx prisma generate 2>&1 | tee /tmp/step-generate.log

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed plans
        run: npm run seed

      - name: Pack the generated client and engine binaries
        run: |
          set -euo pipefail
          mkdir -p .cache/verification
          tar czf .cache/verification/prisma-native-bundle.tgz \
            node_modules/.prisma/client \
            node_modules/@prisma/engines \
            node_modules/@prisma/client
          ls -lh .cache/verification/prisma-native-bundle.tgz
          node -e "const {execSync}=require('child_process');console.log(execSync('npx prisma -v').toString())"

      - name: Publish the bundle on the temporary artifacts branch
        env:
          ARTIFACT_BRANCH: ci/verification-artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$ARTIFACT_BRANCH"
          git rm -rf --cached . >/dev/null
          git add -f .cache/verification/prisma-native-bundle.tgz
          git commit -m "chore(verification): temporary Prisma native bundle for review environment"
          git push --force origin "$ARTIFACT_BRANCH"
