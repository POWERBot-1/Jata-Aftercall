name: PR125 one-shot dependency remediation

on:
  push:
    branches:
      - remediation/owner-authorized-acceptance-v2-2026-11-16

permissions:
  contents: write

jobs:
  remediate:
    if: startsWith(github.event.head_commit.message, '[pr125-deps]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Regenerate lockfile from approved patched dependency versions
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install exact regenerated lockfile
        run: npm ci
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Full no-database unit and integration suite
        run: npx vitest run --exclude tests/e2e
      - name: Require a clean production dependency audit and report all remaining development findings
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit-production.json
          production_status=$?
          npm audit --json > /tmp/audit-full.json
          full_status=$?
          set -e
          node - <<'JS'
          const fs = require('fs');
          const prod = JSON.parse(fs.readFileSync('/tmp/audit-production.json', 'utf8'));
          const full = JSON.parse(fs.readFileSync('/tmp/audit-full.json', 'utf8'));
          const pv = prod.metadata?.vulnerabilities;
          const fv = full.metadata?.vulnerabilities;
          if (!pv || !fv) throw new Error('BLOCKED: npm audit report missing or malformed');
          console.log('Production audit:', JSON.stringify(pv));
          console.log('Full audit:', JSON.stringify(fv));
          console.log('Remaining full-tree packages:', Object.keys(full.vulnerabilities || {}).sort().join(', '));
          if (Number(process.env.PRODUCTION_AUDIT_STATUS) !== 0 || pv.total !== 0) {
            throw new Error('FAIL: production dependency audit still has findings');
          }
          if (fv.total !== 0) console.log('BLOCKED: full-tree development advisories remain; no exception or suppression applied.');
          JS
        env:
          PRODUCTION_AUDIT_STATUS: ${{ steps.audit.outputs.production_status }}
      - name: Commit regenerated lockfile only after tests and production audit pass
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m '[pr125-deps-generated] regenerate patched dependency lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}
