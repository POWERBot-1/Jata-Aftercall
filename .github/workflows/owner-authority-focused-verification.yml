name: Owner authority focused verification

on:
  pull_request:
    branches: [main]
  push:
    branches: ["arena/a3de1985-jata-aftercall"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-authority-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-authority-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Targeted owner authority tests
        run: npm test -- tests/security/admin-page-authorization.test.ts tests/security/admin-team-access-deny.test.ts tests/unit/control-policy-pending-access.test.ts tests/unit/control-role-policy.test.ts
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
