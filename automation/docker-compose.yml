# Standalone n8n service. Do not point this persistence DB at JATA's Neon database.
# Bind to loopback; terminate TLS and enforce access controls at an approved reverse proxy.
services:
  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in an untracked deployment env file}
    volumes: [n8n-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [automation]
  n8n:
    image: n8nio/n8n:2.35.7
    restart: unless-stopped
    depends_on:
      n8n-db: { condition: service_healthy }
    ports: ["127.0.0.1:5678:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set a unique random 32+ character key}
      N8N_HOST: ${N8N_HOST:?Set the approved automation hostname}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      N8N_METRICS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes: [n8n-data:/home/node/.n8n]
    networks: [automation]
volumes:
  n8n-db:
  n8n-data:
networks:
  automation:
    internal: true
