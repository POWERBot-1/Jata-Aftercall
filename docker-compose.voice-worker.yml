# Local/dev orchestration for the persistent voice media worker.
# Production equivalents (Fly.io / Railway / any always-on VM) use the same image and
# environment contract — see docs/integrations/voice-media-worker-deployment.md.
services:
  voice-media-worker:
    build:
      context: .
      dockerfile: Dockerfile.voice-media-worker
    ports:
      - "8787:8787"
    env_file:
      - .env.voice-worker
    environment:
      VOICE_MEDIA_PORT: "8787"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
